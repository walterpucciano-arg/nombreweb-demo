<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velvet Night</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="overlay"></div>

<header class="topbar">
  <div class="logo">VELVET</div>
  <div class="online">127 ONLINE</div>
</header>

<main class="hero">
  <div class="glass login">
    <h1>Entrá al Lounge Privado</h1>
    <p>Conectate con personas reales en un ambiente exclusivo.</p>
    <input placeholder="Usuario">
    <input placeholder="Contraseña" type="password">
    <button>INGRESAR</button>
  </div>

  <div class="glass chat">
    <div class="chat-header">CHAT GENERAL</div>

    <div class="message other">
      <div class="avatar"></div>
      <div class="bubble">Hola 😈</div>
    </div>

    <div class="message me">
      <div class="bubble">¿Quién anda por acá?</div>
    </div>

    <div class="message other">
      <div class="avatar"></div>
      <div class="bubble">Bienvenido al lounge 🔥</div>
    </div>

    <div class="input-area">
      <input placeholder="Escribí un mensaje...">
      <button>➤</button>
    </div>
  </div>
</main>

<section class="users">
  <div class="user-card glass">
    <div class="photo"></div>
    <h3>Sofía</h3>
    <span>Online ahora</span>
  </div>

  <div class="user-card glass">
    <div class="photo"></div>
    <h3>Lucas</h3>
    <span>En videollamada</span>
  </div>

  <div class="user-card glass">
    <div class="photo"></div>
    <h3>Mica</h3>
    <span>Disponible</span>
  </div>
</section>

</body>
</html>
